<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EarthLungs GIS — Redirecting to Platform</title>
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="refresh"
      content="0; url=/EarthLungs-GIS/platform/"
    />
    <link rel="canonical" href="/EarthLungs-GIS/platform/" />
    <script>
      // Fallback redirect in case meta refresh is disabled
      (function () {
        var dest = '/EarthLungs-GIS/platform/';
        if (window.location.pathname !== dest) {
          window.location.replace(dest);
        }
      })();
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f7f8f7;
        color: #1a2e1a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .container h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }
      .container p {
        color: #555;
        font-size: 0.875rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .container a {
        display: inline-block;
        background: #349e40;
        color: #fff;
        text-decoration: none;
        padding: 0.625rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.875rem;
      }
      .container a:hover {
        background: #2d8836;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>EarthLungs GIS</h1>
      <p>The platform page has moved. You should be redirected automatically.</p>
      <a href="/EarthLungs-GIS/platform/">Go to the GIS Platform</a>
    </div>
  </body>
</html>
